services:
  server:
    build:
      context: ./image
      args:
        MC_VERSION: 26.1.1
        PAPER_BUILD: 29
    environment:
      JAVA_XMX: "4G"
      JAVA_XMS: "2G"
    ports:
      - "25565:25565/tcp"
      - "24454:24454/udp"
    volumes:
      - ./data:/srv/server
    stdin_open: true
