services:
  server:
    container_name: ${SERVER_NAME:-papermc-server}
    image: papermc:latest
    build:
      context: ./image
      args:
        JAVA_VERSION: ${JAVA_VERSION:-25}
        MINECRAFT_VERSION: ${MINECRAFT_VERSION:-26.2}
        PAPER_BUILD: ${PAPER_BUILD:-92}
    environment:
      SERVER_NAME: ${SERVER_NAME:-myserver}
      JVM_XMX: ${JVM_XMX:-4096m}
      JVM_XMS: ${JVM_XMS:-4096m}
      JVM_ARGS: ${JVM_ARGS:-}
    ports:
      - "${SERVER_PORT:-25565}:25565/tcp"
      - "${SERVER_VOIP_PORT:-24454}:24454/udp"
      - "${SERVER_RCON_PORT:-25575}:25575/tcp"
    volumes:
      - "papermc-data:/opt/Minecraft/servers"
    stdin_open: true
    tty: true

volumes:
  papermc-data:
    name: papermc-data
