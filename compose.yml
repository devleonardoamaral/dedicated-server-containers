services:
  server:
    container_name: ${CONTAINER_NAME:-neoforge-server}
    image: neoforge:latest
    stop_signal: SIGINT
    build:
      context: ./image
      args:
        JAVA_VERSION: ${JAVA_VERSION:-25}
        NEOFORGE_VERSION: ${NEOFORGE_VERSION:-26.1.2.55-beta}
    environment:
      NEOFORGE_VERSION: ${NEOFORGE_VERSION:-26.1.2.55-beta}
      SERVER_NAME: ${SERVER_NAME:-myserver}
      JVM_XMS: ${JVM_XMS:-4096m}
      JVM_XMX: ${JVM_XMX:-4096m}
      JVM_ARGS: ${JVM_ARGS}
    volumes:
      - neoforge-data:/opt/Minecraft/servers
    ports:
      - ${SERVER_PORT:-25565}:25565/tcp
      - ${SERVER_VOIP_PORT:-24454}:24454/udp
    restart: always
    stdin_open: true
    tty: true

volumes:
  neoforge-data:
    name: neoforge-data
