services:
  server:
    container_name: ${CONTAINER_NAME:-zomboid-server}
    build:
      context: ./image
      args:
        BRANCH: ${BRANCH:-public}
    environment:
      SERVER_NAME: ${SERVER_NAME:-servertest}
      SERVER_RCON_PASSWORD:  ${SERVER_RCON_PASSWORD:-}
      ADMIN_USERNAME: ${ADMIN_USERNAME:-admin}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-admin}
      JVM_XMS: ${JVM_XMS:-4096m}
      JVM_XMX: ${JVM_XMX:-4096m}
      JVM_ARGS: ${JVM_ARGS}
      DISCORD_ENABLE: ${DISCORD_ENABLE:-false}
      DISCORD_TOKEN: ${DISCORD_TOKEN:-}
      DISCORD_CHANNEL_CHAT_NAME: ${DISCORD_CHANNEL_CHAT_NAME:-}
      DISCORD_CHANNEL_LOG_NAME: ${DISCORD_CHANNEL_LOG_NAME:-}
      DISCORD_CHANNEL_CMD_NAME: ${DISCORD_CHANNEL_CMD_NAME:-}
    image: zomboid:latest
    ports:
      - "${SERVER_PORT:-16261}:16261/udp"
      - "${SERVER_UDPPORT_PORT:-16262}:16262/udp"
      - "${SERVER_RCON_PORT:-27015}:27015/tcp"
    volumes:
      - server-data:/root/Zomboid
    stdin_open: true
    tty: true
    stop_grace_period: 30s
    restart: unless-stopped

volumes:
  server-data:
    name: "zomboid-data"
